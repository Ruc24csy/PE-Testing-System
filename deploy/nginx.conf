# 按 Nginx 1.30 及以上写（deploy/install.sh 会从 Nginx 官方源装）。
# 旧版不认 "http2 on;"：一键脚本遇到 1.25 以下的版本会删掉这一行，退回 HTTP/1.1。

# 响应头和错误页里不显示 Nginx 版本号
server_tokens off;

server {
    listen 80;
    server_name pe.example.edu.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pe.example.edu.cn;
    ssl_certificate     /etc/nginx/certs/pe.example.edu.cn.crt;
    ssl_certificate_key /etc/nginx/certs/pe.example.edu.cn.key;

    # 只用有前向保密的 ECDHE 密钥交换，不支持 RSA 密钥交换（TLS 1.3 的套件本身都满足）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
