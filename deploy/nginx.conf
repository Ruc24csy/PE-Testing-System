# 按 Nginx 1.30 及以上写（deploy/install.sh 会从 Nginx 官方源装）。
# 旧版不认 "http2 on;"：一键脚本遇到 1.25 以下的版本会删掉这一行，退回 HTTP/1.1。
#
# 一键脚本把 pe.example.edu.cn 换成 --domain 给的备案域名。
# 还要用服务器 IP 直接访问时，在下面两处 server_name 后面加上 IP（空格隔开）。

# 响应头和错误页里不显示 Nginx 版本号
server_tokens off;

# Host 头不是本站域名的请求（伪造 Host、直接用 IP 访问）一律断开连接，防止 Host 头攻击。
# 443 上借用本站证书完成握手后再断开，兼容各版本 Nginx。
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/certs/pe.example.edu.cn.crt;
    ssl_certificate_key /etc/nginx/certs/pe.example.edu.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

server {
    listen 80;
    server_name pe.example.edu.cn;
    # 跳转目标用配置里的域名，不用请求带来的 Host
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pe.example.edu.cn;
    ssl_certificate     /etc/nginx/certs/pe.example.edu.cn.crt;
    ssl_certificate_key /etc/nginx/certs/pe.example.edu.cn.key;

    # 只用有前向保密的 ECDHE 密钥交换，不支持 RSA 密钥交换（TLS 1.3 的套件本身都满足）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;

    # 用 http:// 访问 443 端口时跳到 https
    error_page 497 =301 https://$server_name$request_uri;

    client_max_body_size 30m;

    # 安全响应头统一在这里加（always：错误页也带上）。
    # 前端没有内联脚本；页面里有 style="..."，所以样式要放行 'unsafe-inline'。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        # 应用自己也会加这几个头（不经 Nginx 直接访问时用），这里去掉，避免重复
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }
}
